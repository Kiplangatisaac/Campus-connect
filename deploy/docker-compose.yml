version: '3.8'

services:
  campus-connect:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./campus.db
      - SYNC_DATABASE_URL=sqlite:///./campus.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_REFRESH_SECRET_KEY=${JWT_REFRESH_SECRET_KEY:-change-me-refresh}
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=30
      - APP_NAME=KyU Campus Connect
      - APP_VERSION=1.0.0
      - ENVIRONMENT=production
      - DEBUG=false
      - BASE_URL=${BASE_URL:-http://localhost:8000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["http://localhost:8000"]}
      - UNIVERSITY_DOMAINS=["students.kyu.ac.ke","staffs.kyu.ac.ke","kyu.ac.ke"]
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/callback/google}
      - UPLOAD_DIR=./uploads
    volumes:
      - campus-data:/app/uploads
      - campus-db:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  campus-data:
  campus-db:
